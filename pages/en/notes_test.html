<!-- pages/notes.html -->
<style>
  .notes-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #000;
    padding-bottom: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .filter-list {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-label {
    font-family: 'VT323', monospace;
    font-size: 1.1rem;
    margin-right: 4px;
  }

  .filter-btn {
    background: #fff;
    border: 2px solid #000;
    padding: 3px 10px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 2px 2px 0px #000;
    transition: all 0.12s ease;
  }

  .filter-btn:hover, .filter-btn.active {
    background: #000;
    color: #fff;
    box-shadow: none;
    transform: translate(2px, 2px);
  }

  .notes-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
  }

  @media (max-width: 640px) {
    .notes-grid {
      grid-template-columns: 1fr;
    }
  }

  .note-card {
    border: 2px solid #000;
    background: #ffffff;
    box-shadow: 4px 4px 0px #000;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .note-card:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0px #000;
  }

  .card-category {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 6px;
  }

  .card-title {
    font-size: 1.15rem;
    font-weight: 600;
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .card-summary {
    font-size: 0.9rem;
    color: #333;
    line-height: 1.5;
    margin-bottom: 14px;
  }

  .card-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .tag {
    font-size: 0.72rem;
    background: #f0ebe0;
    border: 1px solid #000;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
  }

  .card-action-btn {
    align-self: flex-start;
    background: #000;
    color: #fff;
    border: none;
    padding: 5px 12px;
    font-size: 0.8rem;
    font-weight: 600;
    font-family: 'VT323', monospace;
    cursor: pointer;
  }

  .note-detail-view {
    display: none;
  }

  .back-btn {
    background: #ffffff;
    border: 2px solid #000;
    box-shadow: 2px 2px 0px #000;
    padding: 4px 12px;
    font-family: 'VT323', monospace;
    font-size: 1.1rem;
    cursor: pointer;
    margin-bottom: 16px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .back-btn:hover {
    background: #000;
    color: #fff;
  }
</style>

<!-- Top Category Filter Bar -->
<div class="notes-header" id="notes-header">
  <div class="filter-list">
    <span class="filter-label">FILTER:</span>
    <button class="filter-btn active" onclick="filterNotes('all', this)">ALL</button>
    <button class="filter-btn" onclick="filterNotes('imu', this)">IMU Filters</button>
    <button class="filter-btn" onclick="filterNotes('finance', this)">Finance</button>
  </div>
</div>

<!-- Detail View Container -->
<div id="notes-detail-view" class="note-detail-view">
  <button class="back-btn" onclick="hideNoteDetail()">← BACK TO ALL NOTES</button>
  <div id="note-detail-content"></div>
</div>

<script>
  // Filter notes by category tag
  window.filterNotes = function(category, btnEl) {
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    if (btnEl) btnEl.classList.add('active');

    const cards = document.querySelectorAll('.note-card');
    cards.forEach(card => {
      card.style.display = (category === 'all' || card.dataset.category === category) ? 'flex' : 'none';
    });
    hideNoteDetail();
  };

  // Asynchronously load individual note HTML file
  window.showNoteDetail = async function(fileUrl) {
    const headerView = document.getElementById('notes-header');
    const gridView = document.getElementById('notes-grid-view');
    const detailView = document.getElementById('notes-detail-view');
    const detailContent = document.getElementById('note-detail-content');

    // Hide filter header when viewing a note
    if (headerView) headerView.style.display = 'none';
    gridView.style.display = 'none';
    
    detailView.style.display = 'block';
    detailContent.innerHTML = `<div style="padding:20px; text-align:center;">Loading note content...</div>`;

    try {
      const response = await fetch(fileUrl);
      if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
      const htmlText = await response.text();
      detailContent.innerHTML = htmlText;
    } catch (err) {
      console.error(err);
      detailContent.innerHTML = `<p>Error loading <code>${fileUrl}</code>.</p>`;
    }

    const windowContent = document.getElementById('window-content');
    if (windowContent) windowContent.scrollTop = 0;

    const pagesContainer = document.getElementById('pages-container');
    if (pagesContainer) pagesContainer.scrollTop = 0;
  };

  // Return back to notes grid view
  window.hideNoteDetail = function() {
    const headerView = document.getElementById('notes-header');
    const gridView = document.getElementById('notes-grid-view');
    const detailView = document.getElementById('notes-detail-view');

    // Show filter header and grid
    if (headerView) headerView.style.display = 'flex';
    gridView.style.display = 'grid';
    
    detailView.style.display = 'none';
  };
</script>
