<!-- pages/cv_cn.html -->
<div class="page-container" style="max-width: 800px; margin: 0 auto; padding: 20px;">
  
  <h2 class="page-title" style="font-size: 1.75rem; margin-bottom: 20px; border-bottom: 3px solid #000; padding-bottom: 6px; text-transform: uppercase;">
    简历表 // Curriculum Vitae
  </h2>

  <div class="page-body">
    
    <!-- Status Badge -->
    <div style="margin-bottom: 20px;">
      <span style="display: inline-block; background: #000; color: #fff; font-weight: bold; font-size: 0.8rem; padding: 4px 10px; text-transform: uppercase; letter-spacing: 1px;">
        CV // 文件暂未开放
      </span>
    </div>

    <!-- Main Card Section -->
    <div style="border: 2px solid #000; padding: 24px; background: #fafafa; box-shadow: 4px 4px 0px #000; margin-bottom: 24px;">
      <h3 style="font-size: 1.25rem; margin-top: 0; margin-bottom: 12px; border-bottom: 2px solid #000; padding-bottom: 6px;">
        完整 CV 文件暂未开放下载
      </h3>
      
      <p style="font-size: 0.98rem; line-height: 1.7; color: #222; margin-bottom: 20px;">
        我的学术简历（CV）正进行最新格式整理。待首篇研讨会/期刊论文正式发表后，将在此页面同步提供完整 PDF 下载链接与中文网页版简历。
      </p>

      <!-- Status Inner Box -->
      <div style="border: 2px solid #000; background: #fff; padding: 14px; margin-bottom: 20px; box-shadow: 3px 3px 0px #000;">
        <div style="font-weight: bold; font-size: 0.8rem; color: #555; text-transform: uppercase; margin-bottom: 4px;">
          更新时间 Timeline
        </div>
        <div style="font-size: 0.95rem; font-weight: bold; color: #000;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -3px; margin-right: 4px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg> 首篇 Conference 论文发表后开放 PDF 下载
        </div>
      </div>

      <!-- Disabled "Coming Soon" Button (Matching user signature style) -->
      <div>
        <span style="display: inline-flex; align-items: center; gap: 8px; font-weight: bold; font-size: 0.85rem; color: #666; background: #e5e5e5; padding: 10px 18px; border: 2px solid #888; box-shadow: 3px 3px 0px #888; cursor: not-allowed; opacity: 0.8;" title="论文发表后将上传 PDF 下载链接">
          <!-- Lock Icon -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          PDF CV (Available Upon Publication)
        </span>
      </div>

    </div>

  </div>
</div>
